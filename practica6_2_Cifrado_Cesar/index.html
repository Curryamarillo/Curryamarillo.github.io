<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Cifrado Cesar</title>
</head>

<body>
    <section id="container">
        <h1>Cifrado Cesar</h1>
        <form action="">
            <label for="input-frase">Frase:</label>
            <input class="input-text" type="text" name="frase" id="input-frase" placeholder="Introduce la frase a cifrar"><br>
            <label for="paso">Paso:</label>
            <input class="input-text" type="text" name="paso" id="input-paso" placeholder="Cuantas letras debo saltar"><br>
            <input id="codificar" type="submit" value="texto">
        </form>
        <ul id="frase-codificada">
        </ul>
    </section>
    <script src="index.js"></script>
</body>

</html>
